services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: bid
      POSTGRES_USER: bid_owner
      POSTGRES_PASSWORD: ${BID_OWNER_PASSWORD:?Set BID_OWNER_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bid_owner -d bid"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    # Developer test dependency, built from pinned official community source.
    # A maintained production object store remains an explicit deployment choice.
    image: bid-tool-minio-dev:7aac2a2c5b7c
    build:
      context: ..
      dockerfile: deploy/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${BID_S3_ACCESS_KEY:?Set BID_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BID_S3_SECRET_KEY:?Set BID_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - objects:/data
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m app.admin init-db
    environment:
      BID_MIGRATION_DATABASE_URL: ${BID_MIGRATION_DATABASE_URL:?Set migration URL for bid_owner at postgres/bid}
      BID_DATABASE_PASSWORD: ${BID_DATABASE_PASSWORD:?Set BID_DATABASE_PASSWORD}
      BID_PLATFORM_DATABASE_PASSWORD: ${BID_PLATFORM_DATABASE_PASSWORD:-}
      BID_CREDENTIAL_DATABASE_PASSWORD: ${BID_CREDENTIAL_DATABASE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: uvicorn app.api.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log
    ports:
      - "127.0.0.1:8000:8000"
    environment: &runtime
      BID_DATABASE_URL: ${BID_DATABASE_URL:?Set runtime URL for bid_app at postgres/bid}
      BID_PLATFORM_DATABASE_URL: ${BID_PLATFORM_DATABASE_URL:-}
      BID_CREDENTIAL_DATABASE_URL: ${BID_CREDENTIAL_DATABASE_URL:-}
      BID_ENCRYPTION_KEY: ${BID_ENCRYPTION_KEY:?Set encryption key}
      BID_ENCRYPTION_KEY_PREVIOUS: ${BID_ENCRYPTION_KEY_PREVIOUS:-}
      BID_TOKEN_KEY: ${BID_TOKEN_KEY:?Set token key}
      BID_SECRETS_KEY: ${BID_SECRETS_KEY:-}
      BID_SECRETS_KEY_PREVIOUS: ${BID_SECRETS_KEY_PREVIOUS:-}
      BID_STORAGE: ${BID_STORAGE:-local}
      BID_DATA_DIR: /app/data
      BID_S3_ENDPOINT: ${BID_S3_CONTAINER_ENDPOINT:-http://minio:9000}
      BID_S3_BUCKET: ${BID_S3_BUCKET:-bid}
      BID_S3_ACCESS_KEY: ${BID_S3_ACCESS_KEY}
      BID_S3_SECRET_KEY: ${BID_S3_SECRET_KEY}
      BID_OCR_DATA_DIR: /usr/share/tesseract-ocr/5/tessdata
      BID_OCR_LANGUAGE: ${BID_OCR_LANGUAGE:-chi_sim+eng}
      BID_LLM_PROVIDER: ${BID_LLM_PROVIDER:-disabled}
      BID_LLM_MODEL: ${BID_LLM_MODEL:-}
      BID_LLM_BASE_URL: ${BID_LLM_BASE_URL:-}
      BID_LLM_EFFORT: ${BID_LLM_EFFORT:-high}
      BID_LLM_ANTHROPIC_FALLBACK: ${BID_LLM_ANTHROPIC_FALLBACK:-true}
      BID_LLM_JSON_MODE: ${BID_LLM_JSON_MODE:-json_schema}
      BID_LLM_BATCH_CHARS: ${BID_LLM_BATCH_CHARS:-30000}
      BID_SCORE_BATCH_CHARS: ${BID_SCORE_BATCH_CHARS:-64000}
      BID_LLM_MAX_OUTPUT_TOKENS: ${BID_LLM_MAX_OUTPUT_TOKENS:-16000}
      BID_LLM_INPUT_USD_PER_MTOK: ${BID_LLM_INPUT_USD_PER_MTOK:-}
      BID_LLM_OUTPUT_USD_PER_MTOK: ${BID_LLM_OUTPUT_USD_PER_MTOK:-}
      BID_ORG_SIGNUP_ENABLED: ${BID_ORG_SIGNUP_ENABLED:-false}
      BID_PLATFORM_ADMIN_EMAILS: ${BID_PLATFORM_ADMIN_EMAILS:-}
      BID_PLATFORM_TOTP_SECRETS: ${BID_PLATFORM_TOTP_SECRETS:-}
      BID_BILLING_CURRENCY: ${BID_BILLING_CURRENCY:-USD}
      BID_SEARCH_URL: ${BID_SEARCH_URL:-http://searxng:8080}
      BID_SEARCH_PROVIDER: ${BID_SEARCH_PROVIDER:-disabled}
      BID_CONVERTER_URL: ${BID_CONVERTER_URL:-http://converter:3000}
      BID_REVIEW_OFFICE_PROFILE: ${BID_REVIEW_OFFICE_PROFILE:-gotenberg-8.37.0-f29984bd1e226bf1-bundled-fonts-v1}
    volumes:
      - files:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    cpus: "1.0"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m app.jobs.worker
    environment:
      <<: *runtime
      # Workers resolve credentials but cannot use management functions.
      BID_PLATFORM_DATABASE_URL: ""
    volumes:
      - files:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
  searxng:
    # Vendor-source search for the worker only; no host port is published.
    image: searxng/searxng:2026.10.2-19ffbcd30@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
  converter:
    # DOCX to PDF for export page previews (Gotenberg/LibreOffice with CJK fonts). Only the
    # worker calls it; no host port is published and its Chromium and webhook routes are off.
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --webhook-disable=true
      - --api-timeout=180s
volumes:
  postgres:
  objects:
  files:
