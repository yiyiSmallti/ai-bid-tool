[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-bid-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.6,<3",
  "typer>=0.19,<0.20", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "cryptography>=44,<50", "pymupdf>=1.25,<2", "python-docx>=1.1,<2",
  "procrastinate>=3,<4", "boto3>=1.35,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-xdist>=3.6,<4", "ruff>=0.9,<1", "pyright>=1.1,<2"]

[project.scripts]
bid = "bid_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server/app", "cli/bid_cli"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
markers = [
    "latency: asserts a contractual wall-clock bound; CI runs these serially, outside xdist",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]

[tool.pyright]
include = ["server/app", "cli/bid_cli"]
extraPaths = ["server", "cli"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
