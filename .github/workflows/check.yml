name: check
# Pull requests only: main accepts changes only through pull requests that passed these
# checks, so rerunning them on the merge commit would double Actions minutes. Run it by
# hand from the Actions tab when main needs a fresh check. Draft pull requests run
# nothing; marking one ready for review starts the checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request supersedes the running check.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  BID_TEST_ADMIN_URL: postgresql+psycopg://postgres:synthetic-ci-test-only@127.0.0.1:5432/bid_test
  BID_DATABASE_URL: postgresql+psycopg://bid_app:synthetic-ci-test-only@127.0.0.1:5432/bid_test
  BID_DATABASE_PASSWORD: synthetic-ci-test-only
jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Required checks must still report, so a change only to Markdown, docs/ (including
      # review-only contract modules, which nothing imports), the console or the pilot
      # host's deploy scripts succeeds without the Python suite. A manual run has no base
      # and checks everything.
      - name: Detect changes outside documentation, the console and pilot deploy scripts
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- . ':(exclude)*.md' ':(exclude)docs/**' ':(exclude)web/**' ':(exclude)deploy/pilot/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- web; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check server cli scripts evals
      - run: uv run ruff format --check server cli scripts evals
      - run: uv run pyright
      - run: uv build
  # BID_TEST_SHARD splits the selection in server/tests/conftest.py; shard 1 holds only
  # the longest scale test. Each xdist worker gets its own database copy, so every
  # shard runs one worker per runner core.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bid_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BID_TEST_SHARD: ${{ matrix.shard }}/5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-test-env
      - run: uv run pytest -q -n auto -m "not latency" --durations=10
  # Contractual wall-clock bounds (for example the 2-second board snapshot) are
  # measured without other workers competing for the runner's cores.
  latency:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: latency (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bid_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BID_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-test-env
      - run: uv run pytest -q -m latency --durations=10
  # The required "python" check: every Python job passed, or none was needed.
  python:
    needs: [changes, lint, tests, latency]
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python job
        run: |
          [ "${{ needs.changes.result }}" = success ] || { echo "change detection: ${{ needs.changes.result }}"; exit 1; }
          if [ "${{ needs.changes.outputs.code }}" = true ]; then want=success; else want=skipped; fi
          for result in "lint=${{ needs.lint.result }}" "tests=${{ needs.tests.result }}" "latency=${{ needs.latency.result }}"; do
            [ "${result#*=}" = "$want" ] || { echo "$result (expected $want)"; exit 1; }
          done
  web:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Same rule as Python: report success without building when web/ is unchanged.
      - uses: actions/checkout@v4
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: needs.changes.outputs.web == 'true'
      - run: npm run build
        if: needs.changes.outputs.web == 'true'
