name: check
# Pull requests only: main accepts changes only through pull requests that passed these
# checks, so rerunning them on the merge commit would double Actions minutes. Run it by
# hand from the Actions tab when main needs a fresh check.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request supersedes the running check.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d bid_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BID_TEST_ADMIN_URL: postgresql+psycopg://postgres:synthetic-ci-test-only@127.0.0.1:5432/bid_test
      BID_DATABASE_URL: postgresql+psycopg://bid_app:synthetic-ci-test-only@127.0.0.1:5432/bid_test
      BID_DATABASE_PASSWORD: synthetic-ci-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Required checks must still report, so a change only to Markdown or the console
      # succeeds without the suite. A manual run has no base and checks everything.
      - name: Detect changes outside Markdown and the console
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- . ':(exclude)*.md' ':(exclude)web/**'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # The service database is discarded after the job; skipping durability removes the
      # per-commit flushes that dominate the suite's many truncates on runner disks.
      - name: Turn off durability in the throwaway test database
        if: steps.changes.outputs.code == 'true'
        env:
          PGPASSWORD: synthetic-ci-test-only
        run: >-
          psql -h 127.0.0.1 -U postgres -d bid_test -v ON_ERROR_STOP=1
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.code == 'true'
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
        if: steps.changes.outputs.code == 'true'
      - name: Create ephemeral test encryption configuration
        if: steps.changes.outputs.code == 'true'
        run: |
          uv run python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write("BID_ENCRYPTION_KEY=" + Fernet.generate_key().decode() + "\n")
              handle.write("BID_TOKEN_KEY=" + Fernet.generate_key().decode() + "\n")
              handle.write("BID_CLI_KEY=" + Fernet.generate_key().decode() + "\n")
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        if: steps.changes.outputs.code == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            data/work/build/screenshot-renderer
          key: renderer-${{ runner.os }}-${{ hashFiles('stamp/Cargo.lock', 'stamp/Cargo.toml') }}
      - name: Build the screenshot renderer so image tests run instead of skipping
        if: steps.changes.outputs.code == 'true'
        run: CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" sh scripts/build_screenshot_renderer.sh
      - run: uv run ruff check server cli scripts evals
        if: steps.changes.outputs.code == 'true'
      - run: uv run ruff format --check server cli scripts evals
        if: steps.changes.outputs.code == 'true'
      - run: uv run pyright
        if: steps.changes.outputs.code == 'true'
      # Each worker gets its own database (server/tests/conftest.py), so the suite can run in parallel.
      - run: uv run pytest -q -n 4
        if: steps.changes.outputs.code == 'true'
      - run: uv build
        if: steps.changes.outputs.code == 'true'
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same rule as the Python job: report success without building when web/ is unchanged.
      - name: Detect console changes
        id: changes
        working-directory: .
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- web; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.changes.outputs.web == 'true'
      - run: npm run build
        if: steps.changes.outputs.web == 'true'

